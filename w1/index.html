<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 引入 Font Awesome 圖示庫（用於顯示 Instagram 與 Email 圖示） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS 樣式直接寫在 <style> 標籤內 -->
    <style>
        /* --- 1. 全局設定 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            /* 馬卡龍柔粉至薄荷綠漸層背景 */
            background: linear-gradient(135deg, #ffe5ec 0%, #e8f5e9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- 2. 現代風格名片卡片 --- */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 320px;
            padding: 35px 25px;
            border-radius: 28px;
            text-align: center;
            /* 現代微陰影 (Soft Layered Shadow) */
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3),
                        0 4px 12px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4),
                        0 6px 15px rgba(0, 0, 0, 0.04);
        }

        /* --- 3. 圓形大頭貼 --- */
        .avatar-box {
            margin-bottom: 20px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%; /* 正圓形 */
            object-fit: cover;  /* 保持圖片比例不變形 */
            border: 4px solid #fff0f5;
            box-shadow: 0 6px 16px rgba(255, 154, 162, 0.25);
        }

        /* --- 4. 名字與自我介紹 --- */
        .name {
            font-size: 22px;
            color: #4a4a4a;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .bio {
            font-size: 14px;
            color: #7d7d7d;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* --- 5. 馬卡龍按鈕設計 --- */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        /* Instagram 按鈕：粉橘色 */
        .btn-instagram {
            background-color: #ffb7b2;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 183, 178, 0.4);
        }

        .btn-instagram:hover {
            background-color: #ff9aa2;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 154, 162, 0.5);
        }

        /* Email 按鈕：藍紫色 (懸停變薄荷綠) */
        .btn-email {
            background-color: #c7ceea;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(199, 206, 234, 0.4);
        }

        .btn-email:hover {
            background-color: #b5ead7;
            color: #4a4a4a;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(181, 234, 215, 0.5);
        }
    </style>
</head>
<body>

    <!-- 卡片主體結構 -->
    <div class="card">
        
        <!-- 1. 圓形大頭貼 -->
        <div class="avatar-box">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=400&auto=format&fit=crop" alt="個人大頭貼" class="avatar">
        </div>

        <!-- 2. 名字與簡短自我介紹 -->
        <h1 class="name">陳小明</h1>
        <p class="bio">用色彩與設計，紀錄生活中的微甜美好 ✨</p>

        <!-- 3. 下方按鈕 -->
        <div class="button-group">
            <a href="https://instagram.com" target="_blank" class="btn btn-instagram">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>
            <a href="mailto:your_email@example.com" class="btn btn-email">
                <i class="fa-regular fa-envelope"></i> Email
            </a>
        </div>

    </div>

</body>
</html>
